name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run typecheck:test
      - run: pnpm typecheck:web
      # No Ollama / Qdrant / Postgres here: the live-stack tests skip themselves,
      # the offline ones (loader, chunker, prompt, refusal, ...) run.
      - run: pnpm test
