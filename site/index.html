<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbf8f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1d1a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="LocalCortex is a fully local RAG app: chat with your documents while every model, vector and message stays on your machine." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Link previews (X, LinkedIn, Slack, Discord). Absolute URLs: crawlers don't resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LocalCortex" />
    <meta property="og:title" content="LocalCortex: chat with your documents, entirely on your machine" />
    <meta property="og:description" content="A fully local RAG app with Ollama, Qdrant and Postgres. Answers with sources, refuses what your documents don't cover. Open source." />
    <meta property="og:url" content="https://sekharendu.github.io/LocalCortex/" />
    <meta property="og:image" content="https://sekharendu.github.io/LocalCortex/og-image.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1254" />
    <meta property="og:image:alt" content="LocalCortex chat UI answering questions about an employee handbook, with 98% answers correct and 14/14 off-topic questions refused" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LocalCortex: chat with your documents, entirely on your machine" />
    <meta name="twitter:description" content="A fully local RAG app with Ollama, Qdrant and Postgres. Answers with sources, refuses what your documents don't cover. Open source." />
    <meta name="twitter:image" content="https://sekharendu.github.io/LocalCortex/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet" />
    <title>LocalCortex</title>
    <script>
      // Set the theme before first paint so there's no light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
