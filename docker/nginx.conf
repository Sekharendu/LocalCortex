# Serves the chat UI and proxies /api/* to the API, like Vite's dev proxy does.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Matches MAX_INGEST_BYTES (50 MB).
  client_max_body_size 50m;

  location /api/ {
    # The trailing slash strips /api, so /api/health reaches the API as /health.
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    # Answers stream token by token; buffering would hold them back until the end.
    proxy_buffering off;
    # CPU answers can take minutes, and ingesting a big PDF longer.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  # Client-side routes (/c/<id>) fall back to the app.
  location / {
    try_files $uri /index.html;
  }
}
